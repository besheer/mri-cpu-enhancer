[project]
name = "mri-cpu-enhancer"
version = "1.5.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "python-multipart==0.0.20",
    "pydicom==3.0.1",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "SimpleITK==2.5.6",
    "pytest==8.4.1",
    "httpx==0.28.1",
    "psutil==7.0.0",
    "pynetdicom==3.0.4",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime==1.20.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
